<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/x-icon" href="/static/assets/zentable/favicon.ico" />
  <link rel="icon" type="image/png" sizes="32x32" href="/static/assets/zentable/favicon_32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/static/assets/zentable/favicon_16.png" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
    <title>Kitchen — {{ data.restaurant.name }}</title>

    <!-- Google Fonts — Jinja2 render karega -->
    <link href="https://fonts.googleapis.com/css2?family={{ data.theme.font_secondary.replace(' ', '+') }}:wght@300;400;500;600&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Theme variables — Jinja2 se inject -->
    <style>
        :root {
            --primary: {{ data.theme.primary_color }};
            --secondary: {{ data.theme.secondary_color }};
            --font-primary: '{{ data.theme.font_primary }}', serif;
            --font-secondary: '{{ data.theme.font_secondary }}', sans-serif;
            --radius: 14px;
            --shadow: 0 2px 16px rgba(0,0,0,0.08);
        }
    </style>

    <!-- Static CSS -->
    <link rel="stylesheet" href="/static/css/staff_kitchen.css?v={{ static_v('css/staff_kitchen.css') }}">

    <style>
        /* Delivery order — orange-amber left border, distinct from table orders */
        .order-card.order-type-delivery {
            border-left: 4px solid #F59E0B !important;
        }
        .order-card.order-type-delivery .order-type-label {
            background: #FEF3C7;
            color: #92400E;
            border-radius: 6px;
            padding: 2px 8px;
            font-size: 0.72rem;
            font-weight: 600;
            letter-spacing: 0.04em;
        }

        /* 3-way toggle */
        .order-filter-toggle {
            display: inline-flex;
            background: rgba(0,0,0,0.07);
            border-radius: 10px;
            padding: 3px;
            gap: 2px;
        }
        .order-filter-toggle button {
            border: none;
            background: transparent;
            border-radius: 8px;
            padding: 6px 14px;
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            color: rgba(0,0,0,0.5);
            transition: background 0.18s, color 0.18s;
            white-space: nowrap;
        }
        .order-filter-toggle button.active {
            background: #fff;
            color: rgba(0,0,0,0.85);
            box-shadow: 0 1px 4px rgba(0,0,0,0.10);
        }
        /* Hide order cards based on active filter */
        body[data-order-filter="delivery"] .order-card.order-type-table { display: none !important; }
        body[data-order-filter="table"]    .order-card.order-type-delivery { display: none !important; }
    </style>
</head>
<body data-order-filter="all">

<div class="topbar">
    <div class="topbar-left">
        <img src="{{ data.restaurant.logo }}" alt="logo">
        <h1>{{ data.restaurant.name }}</h1>
    </div>
    <div style="display:flex;align-items:center;gap:10px">
        <span class="role-badge">KITCHEN</span>
        <a href="#" class="logout-btn" onclick="doLogout()">Logout</a>
    </div>
</div>

<div class="body">
    <div class="toolbar">
        <h2>🔥 Live Orders</h2>
        <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
            <div class="order-filter-toggle" id="orderFilterToggle">
                <button class="active" data-filter="all" onclick="setOrderFilter('all', this)">
                    <i class="fas fa-border-all" style="margin-right:5px;font-size:0.75rem;"></i>All
                </button>
                <button data-filter="delivery" onclick="setOrderFilter('delivery', this)">
                    <i class="fas fa-motorcycle" style="margin-right:5px;font-size:0.75rem;"></i>Delivery
                </button>
                <button data-filter="table" onclick="setOrderFilter('table', this)">
                    <i class="fas fa-utensils" style="margin-right:5px;font-size:0.75rem;"></i>Table
                </button>
            </div>
            <button class="refresh-btn" onclick="load()"><i class="fas fa-rotate"></i> Refresh</button>
        </div>
    </div>
    <div id="orders-list">
        <div class="empty-state"><i class="fas fa-spinner fa-spin"></i><p>Loading...</p></div>
    </div>
</div>

<div id="toast"></div>

<!-- Jinja2 variables inject — static JS se PEHLE -->
<script>
    const clientId = "{{ client_id }}";
    const restaurantLogo = "{{ data.restaurant.logo }}";
    const branchId = "{{ branch_id }}";
</script>

<!-- Static JS -->
<script src="/static/js/staff_kitchen.js?v={{ static_v('js/staff_kitchen.js') }}"></script>
<script>
async function doLogout() {
    await fetch('/api/auth/logout', { method: 'POST' });
    window.location.replace('/login');
}

function setOrderFilter(filter, btn) {
    document.body.setAttribute('data-order-filter', filter);
    document.querySelectorAll('#orderFilterToggle button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
}
</script>


<div style="text-align:center;padding:10px;font-size:0.72rem;color:rgba(0,0,0,0.3);display:flex;align-items:center;justify-content:center;gap:6px;">
    Powered by
    <img src="/static/assets/zentable/logo_dark_512.png" alt="{{ site.name }}" style="width:13px;height:13px;object-fit:contain;opacity:0.5;vertical-align:middle;" />
    <span>{{ site.name }}</span>
</div>

</body>
</html>
